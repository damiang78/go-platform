name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: extractions/setup-just@v2

      - name: Install tools
        run: just tools

      - name: Run full pipeline
        run: just

      - name: Release
        run: .bin/semantic-release release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
