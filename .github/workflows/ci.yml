name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  checks: write
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: extractions/setup-just@v2

      - name: Install tools
        run: just tools

      - name: Check formatting
        run: just fmt

      - name: Vet
        run: just vet

      - name: Check go.mod tidy
        run: just tidy

      - name: Lint
        run: just lint

      - name: Test
        run: just test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/junit.xml

      - name: Test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Go Tests
          path: test-results/junit.xml
          reporter: java-junit

      - name: Build
        run: just build
